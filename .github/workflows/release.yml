name: Release

# Publish on a version tag. The tag is the release source of truth:
# v0.1.0 must match pyproject.toml's version = "0.1.0".
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
          version: "latest"

      - name: Install dependencies
        run: uv sync --locked

      - name: Check version
        run: |
          set -euo pipefail
          VERSION=$(uv version --short)
          TAG_VERSION=${GITHUB_REF_NAME#v}
          echo "project=$VERSION tag=$TAG_VERSION"
          test "$VERSION" = "$TAG_VERSION"

      - name: Run tests
        run: uv run poe test

      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: uv publish --check-url https://pypi.org/simple/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.whl \
            --title "$GITHUB_REF_NAME" \
            --generate-notes; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.whl --clobber
          fi
